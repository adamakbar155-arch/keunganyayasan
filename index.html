         sendiri; gambar juga boleh dari data:/blob: (logo yayasan dan lampiran). Tidak ada sambungan ke server luar,

         isian yang tidak sengaja dipasang sebagai HTML, skrip di dalamnya tetap tidak bisa berjalan. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; frame-src blob:; base-uri 'none'; form-action 'none'">
